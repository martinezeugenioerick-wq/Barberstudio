<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subir Foto | BARBERSTUDIO</title>

<link rel="stylesheet" href="styles.css">

<style>

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#0d0d0d;
color:white;
}

.contenedor{
max-width:700px;
margin:50px auto;
background:#1b1b1b;
padding:30px;
border-radius:20px;
box-shadow:0 0 20px rgba(212,175,55,.3);
}

h1{
text-align:center;
color:#d4af37;
}

input,select,button{
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:10px;
font-size:16px;
}

input,select{
background:#2b2b2b;
color:white;
}

button{
background:#d4af37;
color:black;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#f5c542;
}

#preview{
margin-top:20px;
width:100%;
border-radius:15px;
display:none;
}

a{
color:#d4af37;
text-decoration:none;
}

</style>

</head>

<body>

<div class="contenedor">

<h1>📸 Subir Nuevo Corte</h1>

<input type="text" id="nombre" placeholder="Nombre del corte">

<select id="categoria">

<select>

<option>Fade</option>

<option>Taper</option>

<option>Barba</option>

<option>Diseño</option>

<option>Otro</option>

</select>

<input type="file" id="imagen" accept="image/*">

<img id="preview">

<button id="btnGuardar">
Guardar
</button>

<a href="panel.html">⬅ Regresar al Panel</a>

</div>

<script>

const imagen=document.getElementById("imagen");

const preview=document.getElementById("preview");

imagen.onchange=function(){

const archivo=this.files[0];

if(archivo){

preview.src=URL.createObjectURL(archivo);

preview.style.display="block";

}

}

</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

</body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

<script src="supabase.js"></script>

</html>
